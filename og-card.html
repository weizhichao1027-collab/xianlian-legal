<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>吉他自习室社交分享封面</title>
  <link rel="icon" href="./assets/app-icon.png" type="image/png">
  <link rel="stylesheet" href="./og-card.css">
</head>
<body>
  <main class="card" aria-label="吉他自习室社交分享封面">
    <div class="copy">
      <div class="brand">
        <img src="./assets/app-icon.png" width="72" height="72" alt="">
        <span>吉他自习室</span>
      </div>
      <p class="eyebrow">给零基础的民谣吉他练习 App</p>
      <h1>每天 10 分钟，走完 90 天吉他入门路径。</h1>
      <p class="detail">短课、曲谱和本机麦克风反馈，把每天该练什么讲清楚。</p>
      <p class="meta">iPhone 与 iPad。免费，无订阅与内购。</p>
    </div>
    <div class="visual" aria-hidden="true">
      <div class="strings"><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div class="phone"><img src="./assets/today.webp" width="660" height="1434" alt=""></div>
      <div class="practice-note"><small>今日约</small><strong>10</strong><small>分钟</small></div>
    </div>
  </main>
</body>
</html>
